    <!--action : où on envoie les données pour le traitement
    method : comment envoyer les données
    GET : récupération des données (rechercher / filtres)
    POST : Créer / ajouter des données (log in, subscription...)-->
    <main>
        <section>
            <form method="post">
                <h2>Inscription</h2>

                <fieldset>
                    <legend>Informations personnelles</legend>
                    <div>
                        <label for="name">Nom :</label>
                        <input id="name" placeholder="Votre nom" required>

                        <label for="prenom">Prénom :</label>
                        <input id="prenom" placeholder="Votre prénom" required>
                    </div>

                    <div>
                        <label for="email">Email :</label>
                        <input type="email" id="email" placeholder="Vote e-mail" required>
                    </div>

                    <div>
                        <label for="pwd">Mot de passe</label>
                        <input type="password" id="pwd" placeholder="Votre mot de passe" required>
                    </div>

                    <div>
                        <label for="pwd">Confirmez votre mot de passe</label>
                        <input type="password" id="confirm-pwd" placeholder="Votre mot de passe" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Informations suplémentaires</legend>
                    <!--radio-->
                    <div>
                        <label>Genre :</label>
                        <input type="radio" id="femme" name="Genre" value="femme">
                        <label for="femme">femme</label>

                        <input type="radio" id="homme" name="Genre" value="homme">
                        <label for="homme">homme</label>

                        <input type="radio" id="autre" name="Genre" value="autre">
                        <label for="femme">Autre</label>
                    </div>


                    <!--checkbox-->
                    <div>
                        <label>Intérêts</label>
                        <input type="checkbox" name="interets" id="illustration" value="illustration">
                        <label for="illustration">Illustration</label>

                        <input type="checkbox" name="interets" id="marque-page" value="marque-page">
                        <label for="marque-page">Marque page</label>

                        <input type="checkbox" name="interets" id="accessoires" value="accessoires">
                        <label for="accessoires">Stickers</label>
                    </div>

                    <div>
                        <!--liste deroulante-->
                        <label for="pays">Pays</label>
                        <select name="oays" id="pays">
                            <option value="france">France</option>
                            <option value="allemagne">Allemagne</option>
                            <option value="espagne">Espagne</option>
                        </select>
                    </div>


                    <input type="checkbox" name="cgv" id="cgv" value="cgv" required>
                    <label for="cgv">J'accepte les conditions d'utilisation</label><br>

                    <input type="checkbox" name="newsletter" id="newsletter" value="newsletter">
                    <label for="newsletter">Je souhaite recevoir des offres et bons plan</label><br>
                </fieldset>

                <button type="submit">S'inscrire</button>
            </form>
            </section>
    </main>
