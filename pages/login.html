    <main>
        <section>
            <form class="formulaire" method="post">
                <h2>Me connecter</h2>
                <fieldset class="personnal-info">
                    <legend>Informations de connexion</legend>
                    <div>
                        <label for="email">Email :</label>
                        <input type="email" id="email" placeholder="Vote e-mail" required>
                    </div>

                    <div>
                        <label for="pwd">Mot de passe</label>
                        <input type="password" id="pwd" placeholder="Votre mot de passe" required>
                    </div>

                </fieldset>

                <div class="button-form">
                    <button type="submit">Me connecter</button>
                </div>
                <p>Pas encore de compte ? <a href="signup.html">Créer mon compte.</a></p>
            </form>
        </section>
