    <main>
        <section>
            <form class="personnal-info form-contact" method="post">
                <h2>Nous contacter</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Nom :</label>
                        <input type="text" id="name" placeholder="Votre nom" required>
                    </div>
                    <div class="form-group">
                        <label for="prenom">Prénom :</label>
                        <input id="prenom" type="text" placeholder="Votre prénom">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email :</label>
                        <input type="email" id="email" placeholder="Votre e-mail">
                    </div>
                    <div class="form-group">
                        <label for="commande">Numéro de commande :</label>
                        <input type="number" id="commande" placeholder="Votre numéro de commande" required>
                    </div>
                </div>

                <div>
                    <label for="message">Votre message :</label>
                    <textarea rows="3" id="message" name="message" placeholder="Votre message" required></textarea>
                </div>

                <div class="button-form">
                    <button type="submit">Nous contacter</button>
                </div>
            </form>
        </section>
    </main>
